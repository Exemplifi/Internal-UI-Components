<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel Component Variants</title>
  <link rel="stylesheet" href="../assets/dist/style.min.css">
</head>

<body>


  <!-- Carousel Variant 4 (NCM Spotlight Slider) -->
  <section class="carousel carousel--v4 ncm-slider-section py-5" aria-labelledby="ncm-slider-section-title">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12 col-lg-3">
          <h2 class="slider-title h4" id="ncm-slider-section-title">
            In the Spotlight — <span>Exhibits & Events</span>
          </h2>
        </div>
        <div class="col-12 col-lg-9 slider-content-wrapper">
          <div class="slider-content">
            <h3 class="visually-hidden" id="ncm-slider-spotlight-heading">Featured spotlight cards</h3>
            <div class="js-ncm-slider" aria-roledescription="carousel" aria-labelledby="ncm-slider-spotlight-heading">
              <div class="slider-card">
                <img src="../assets/images/carousel-img/carousel-image.jpg" alt="Dinosaur skeleton exhibit"
                  class="slider-card__image">
                <div class="slider-card__content">
                  <div class="slider-card__label">
                    <p class="glass-btn body-md">Featured</p>
                  </div>
                  <h4 class="slider-card__title">Dueling Dinosaurs</h4>
                  <p class="slider-card__description body-sm">Downtown Raleigh</p>
                  <a href="#" class="btn btn-slider" aria-label="View Dueling Dinosaurs exhibit">
                    Exhibit
                  </a>
                </div>
              </div>

              <div class="slider-card">
                <img src="../assets/images/carousel-img/carousel-image-1.jpg" alt="Discovery Room hands-on exhibit"
                  class="slider-card__image">
                <div class="slider-card__content">
                  <h4 class="slider-card__title">Discovery Room</h4>
                  <p class="slider-card__description body-sm">Exploration Center</p>
                  <a href="#" class="btn btn-slider" aria-label="View Discovery Room permanent exhibit">
                    Exhibit
                  </a>
                </div>
              </div>

              <div class="slider-card">
                <img src="../assets/images/carousel-img/carousel-image-2.jpg" alt="SECU Daily Planet theater dome"
                  class="slider-card__image">
                <div class="slider-card__content">
                  <h4 class="slider-card__title">Daily Planet</h4>
                  <p class="slider-card__description body-sm">Research Center</p>
                  <a href="#" class="btn btn-slider" aria-label="View Daily Planet permanent exhibit">
                    Exhibit
                  </a>
                </div>
              </div>

              <div class="slider-card">
                <img src="../assets/images/carousel-img/carousel-image-3.jpg" alt="Galaxy First Friday night event"
                  class="slider-card__image">
                <div class="slider-card__content">
                  <h4 class="slider-card__title">First Friday</h4>
                  <p class="slider-card__description body-sm">Downtown Raleigh</p>
                  <a href="#" class="btn btn-slider" aria-label="View Galaxy First Friday event">
                    Event
                  </a>
                </div>
              </div>

              <div class="slider-card">
                <img src="../assets/images/carousel-img/carousel-image-4.jpg" alt="Science Live Lab demonstration"
                  class="slider-card__image">
                <div class="slider-card__content">
                  <h4 class="slider-card__title">Live Lab</h4>
                  <p class="slider-card__description body-sm">Research Center</p>
                  <a href="#" class="btn btn-slider" aria-label="View Science Live Lab program">
                    Program
                  </a>
                </div>
              </div>
            </div>
            <div class="slider-btn-wrapper" role="group" aria-label="Slider navigation controls"></div>
            <p class="visually-hidden" data-ncm-slider-live aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>
      </div>
    </div>
  </section>



  <script src="../assets/dist/main.min.js"></script>
</body>

</html>
