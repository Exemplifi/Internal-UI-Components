<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="../assets/dist/style.min.css">
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <main id="main-content" role="main" tabindex="-1">
  <section class="form-section form-section--v1 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <h2 class="form-section__title mb-4">Signage Request (v1)</h2>
          <form class="form form--v1 mx-auto" id="contactFormV1" novalidate enctype="multipart/form-data">
            <div class="row g-3">
              <div class="col-12">
                <label for="name-v1" class="form__label">Name*</label>
                <input type="text" class="form__input form-control" id="name-v1" name="name" required
                  aria-required="true" placeholder="Your Name">
              </div>
              <div class="col-12">
                <label for="organization-v1" class="form__label">Organization*</label>
                <input type="text" class="form__input form-control" id="organization-v1" name="organization" required
                  aria-required="true" placeholder="Your Organization">
              </div>
              <div class="col-12">
                <label for="email-v1" class="form__label">Email ID*</label>
                <input type="email" class="form__input form-control" id="email-v1" name="email" required
                  aria-required="true" placeholder="you@email.com">
              </div>
              <div class="col-12">
                <label for="phone-v1" class="form__label">Phone Number*</label>
                <input type="tel" class="form__input form-control" id="phone-v1" name="phone" required
                  aria-required="true" placeholder="(555) 555-5555">
              </div>
              <div class="col-12">
                <label for="signType-v1" class="form__label">Sign Type*</label>
                <div class="form__select-wrapper position-relative">
                  <select class="form__input form__select form-control" id="signType-v1" name="signType" required
                    aria-required="true">
                    <option value="">Select a sign type</option>
                    <option value="type1">Type 1</option>
                    <option value="type2">Type 2</option>
                  </select>
                  <span class="form__select-icon position-absolute end-0 top-50 translate-middle-y pe-3" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                      <path d="M6 9L12 15L18 9" stroke="#314459" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    </svg>
                  </span>
                </div>
              </div>
              <div class="col-12">
                <label for="logo-v1" class="form__label">Logo*</label>
                <div class="form__file-upload d-flex align-items-center gap-3 p-2 rounded">
                  <label for="logo-v1" class="form__file-label d-flex align-items-center gap-2 mb-0" tabindex="0">
                    <span class="form__file-icon" aria-hidden="true">
                      <svg width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <rect width="24" height="24" rx="12" fill="#6381A4" />
                        <path d="M16 12v4a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-4" stroke="#fff" stroke-width="2" />
                        <path d="M12 16V8" stroke="#fff" stroke-width="2" />
                        <path d="M8 12l4-4 4 4" stroke="#fff" stroke-width="2" />
                      </svg>
                    </span>
                    <span class="form__file-text">Choose File</span>
                  </label>
                  <input type="file" class="form__input form__file-input visually-hidden" id="logo-v1" name="logo"
                    accept=".png,.eps" required aria-required="true" aria-describedby="logo-v1-helper">
                  <span id="logo-v1-helper" class="form__file-helper text-muted small">Please upload a png or eps file of your logo.</span>
                </div>
              </div>
              <div class="col-12">
                <div class="form__recaptcha d-flex align-items-center gap-2 p-2 rounded">
                  <input type="checkbox" class="form__recaptcha-checkbox" id="recaptcha-v1" name="recaptcha" required
                    aria-required="true">
                  <label for="recaptcha-v1" class="form__recaptcha-label mb-0">I'm not a robot</label>
                  <span class="form__recaptcha-icon ms-2" aria-hidden="true">
                    <svg width="42" height="40" viewBox="0 0 42 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                      <g>
                        <path d="M9.55 0C22.1 0 34.67 0 25.12 13.97C9.55 0 25.12 13.97 9.55 0Z" fill="#1C3AA9" />
                        <path d="M6.67 0C20.61 0 13.94 25.17 6.67 0Z" fill="#4285F4" />
                        <path d="M6.67 14.01C20.61 14.01 25.12 27.98 6.67 14.01Z" fill="#ABABAB" />
                        <path d="M0 33.4C14.67 33.4 42 40 0 33.4Z" fill="#A6A6A6" />
                      </g>
                    </svg>
                  </span>
                </div>
              </div>
              <div class="col-12">
                <button type="submit"
                  class="form__btn btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
                  <span>Submit</span>
                  <span class="form__btn-icon" aria-hidden="true">
                    <span class="form__btn-circle d-inline-flex align-items-center justify-content-center">
                      <svg width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="10" cy="10" r="10" fill="#459DFF" />
                        <path d="M8 6l4 4-4 4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"
                          stroke-linejoin="round" />
                      </svg>
                    </span>
                  </span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  </main>
  <script src="../assets/dist/main.min.js"></script>
</body>

</html>
