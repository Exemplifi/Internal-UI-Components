<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel v3 — Hero + thumbnail gallery</title>
  <link rel="stylesheet" href="../assets/dist/style.min.css">
</head>

<body>
  <a class="skip-link btn btn-primary visually-hidden-focusable position-absolute top-0 start-0 ms-2 mt-2"
    href="#carousel-v3-main">
    Skip to carousel content
  </a>

  <main id="carousel-v3-main" tabindex="-1">
    <section class="internal-carousel v3" aria-labelledby="carousel-v3-heading">
      <div class="container">
        <div class="section-header-wrapper">
          <h2 id="carousel-v3-heading">A Closer Look at Our Work</h2>
        </div>

        <div class="internal-carousel-hero">
          <div class="internal-carousel-hero-scroll">
            <figure class="internal-carousel-hero-figure" aria-hidden="true">
              <img class="internal-carousel-hero-img"
                src="../assets/images/carousel-img/carousel-v3/thumb-1.png" alt="" decoding="async"
                fetchpriority="high">
            </figure>
          </div>
          <p class="internal-carousel-hero-caption" data-internal-carousel-hero-caption>
            Artist rendering of new cruise dock as planned, with terminal, and freight dock (near top)
          </p>
          <p class="visually-hidden">
            <span data-internal-carousel-v3-status role="status" aria-live="polite" aria-atomic="true"></span>
          </p>
        </div>

        <div class="internal-carousel-gallery">
          <div class="internal-carousel-swiper swiper" data-internal-carousel-v3 role="radiogroup"
            aria-label="Photo gallery. Use Tab to reach a thumbnail, then Left or Right arrow keys to choose a photo.">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="true"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-v3/thumb-1.png"
                    data-internal-carousel-caption="Artist rendering of new cruise dock as planned, with terminal, and freight dock (near top)"
                    aria-label="Photo 1 of 5: Artist rendering of new cruise dock as planned, with terminal, and freight dock (near top)">
                    <img src="../assets/images/carousel-img/carousel-v3/thumb-1.png" alt="" aria-hidden="true"
                      decoding="async">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Dock plan</figcaption>
                </figure>
              </div>
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="false"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-v3/thumb-2.png"
                    data-internal-carousel-caption="Diagram showing two ships at dock, with 2026 temporary bridge in brown"
                    aria-label="Photo 2 of 5: Diagram showing two ships at dock, with 2026 temporary bridge in brown">
                    <img src="../assets/images/carousel-img/carousel-v3/thumb-2.png" alt="" aria-hidden="true"
                      decoding="async" loading="lazy">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Ships</figcaption>
                </figure>
              </div>
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="false"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-v3/thumb-3.png"
                    data-internal-carousel-caption="Dock and transfer span ramp to terminal, with temporary bridge (in brown)"
                    aria-label="Photo 3 of 5: Dock and transfer span ramp to terminal, with temporary bridge (in brown)">
                    <img src="../assets/images/carousel-img/carousel-v3/thumb-3.png" alt="" aria-hidden="true"
                      decoding="async" loading="lazy">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Ramp</figcaption>
                </figure>
              </div>
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="false"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-v3/thumb-4.png"
                    data-internal-carousel-caption="Facility plan diagram of dock and terminal layout"
                    aria-label="Photo 4 of 5: Facility plan diagram of dock and terminal layout">
                    <img src="../assets/images/carousel-img/carousel-v3/thumb-4.png" alt="" aria-hidden="true"
                      decoding="async" loading="lazy">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Layout</figcaption>
                </figure>
              </div>
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="false"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-v3/hero.png"
                    data-internal-carousel-caption="Current photo of floating dock and mooring dolphins, with terminal at far right"
                    aria-label="Photo 5 of 5: Current photo of floating dock and mooring dolphins, with terminal at far right">
                    <img src="../assets/images/carousel-img/carousel-v3/hero.png" alt="" aria-hidden="true"
                      decoding="async" loading="lazy">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Dock today</figcaption>
                </figure>
              </div>
            </div>
          </div>

          <div class="internal-carousel-nav" role="group" aria-label="Thumbnail gallery controls">
            <button type="button" class="internal-carousel-arrow" data-internal-carousel-v3-prev
              aria-label="Show previous thumbnails">
              <i data-lucide="arrow-left" aria-hidden="true"></i>
            </button>
            <button type="button" class="internal-carousel-arrow" data-internal-carousel-v3-next
              aria-label="Show next thumbnails">
              <i data-lucide="arrow-right" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../assets/dist/main.min.js"></script>
</body>

</html>
