<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel v3 — Hero + thumbnail gallery</title>
  <link rel="stylesheet" href="../assets/dist/style.min.css">
</head>

<body>
  <a class="skip-link btn btn-primary visually-hidden-focusable position-absolute top-0 start-0 ms-2 mt-2"
    href="#carousel-v3-main">
    Skip to carousel content
  </a>

  <main id="carousel-v3-main" tabindex="-1">
    <section class="internal-carousel v3" aria-labelledby="carousel-v3-heading">
      <div class="container">
        <div class="section-header-wrapper">
          <h2 id="carousel-v3-heading">A Closer Look at Our Work</h2>
        </div>

        <div class="internal-carousel-hero">
          <div class="internal-carousel-hero-scroll">
            <figure class="internal-carousel-hero-figure" aria-hidden="true">
              <img src="../assets/images/carousel-img/carousel-image-1.jpg" alt="" decoding="async">
            </figure>
          </div>
          <p class="internal-carousel-hero-caption" data-internal-carousel-hero-caption>
            Community outreach event with partners and volunteers
          </p>
          <p class="visually-hidden">
            <span data-internal-carousel-v3-status role="status" aria-live="polite" aria-atomic="true"></span>
          </p>
        </div>

        <div class="internal-carousel-gallery">
          <div class="internal-carousel-swiper swiper" data-internal-carousel-v3 role="radiogroup"
            aria-label="Photo gallery. Use Tab to reach a thumbnail, then Left or Right arrow keys to choose a photo.">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="true"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-image-1.jpg"
                    data-internal-carousel-caption="Community outreach event with partners and volunteers"
                    aria-label="Photo 1 of 5: Community outreach event with partners and volunteers">
                    <img src="../assets/images/carousel-img/carousel-image-1.jpg" alt="" aria-hidden="true"
                      decoding="async">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Outreach</figcaption>
                </figure>
              </div>
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="false"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-image-2.jpg"
                    data-internal-carousel-caption="Field research and water quality monitoring"
                    aria-label="Photo 2 of 5: Field research and water quality monitoring">
                    <img src="../assets/images/carousel-img/carousel-image-2.jpg" alt="" aria-hidden="true"
                      decoding="async" loading="lazy">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Research</figcaption>
                </figure>
              </div>
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="false"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-image-3.jpg"
                    data-internal-carousel-caption="Infrastructure and facility overview"
                    aria-label="Photo 3 of 5: Infrastructure and facility overview">
                    <img src="../assets/images/carousel-img/carousel-image-3.jpg" alt="" aria-hidden="true"
                      decoding="async" loading="lazy">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Facility</figcaption>
                </figure>
              </div>
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="false"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-image-4.jpg"
                    data-internal-carousel-caption="Team collaboration during a planning workshop"
                    aria-label="Photo 4 of 5: Team collaboration during a planning workshop">
                    <img src="../assets/images/carousel-img/carousel-image-4.jpg" alt="" aria-hidden="true"
                      decoding="async" loading="lazy">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Workshop</figcaption>
                </figure>
              </div>
              <div class="swiper-slide">
                <figure class="internal-carousel-media">
                  <button type="button" class="internal-carousel-thumb" role="radio" aria-checked="false"
                    data-internal-carousel-thumb="../assets/images/carousel-img/carousel-image.jpg"
                    data-internal-carousel-caption="Landscape view of the project site"
                    aria-label="Photo 5 of 5: Landscape view of the project site">
                    <img src="../assets/images/carousel-img/carousel-image.jpg" alt="" aria-hidden="true"
                      decoding="async" loading="lazy">
                  </button>
                  <figcaption class="internal-carousel-thumb-caption" aria-hidden="true">Site</figcaption>
                </figure>
              </div>
            </div>
          </div>

          <div class="internal-carousel-nav" role="group" aria-label="Thumbnail gallery controls">
            <button type="button" class="internal-carousel-arrow" data-internal-carousel-v3-prev
              aria-label="Show previous thumbnails">
              <i data-lucide="arrow-left" aria-hidden="true"></i>
            </button>
            <button type="button" class="internal-carousel-arrow" data-internal-carousel-v3-next
              aria-label="Show next thumbnails">
              <i data-lucide="arrow-right" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../assets/dist/main.min.js"></script>
</body>

</html>
